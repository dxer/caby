[package]
name = "caby"
version = "0.1.0"
edition = "2021"
description = "CabyMCP - Keep your agent calm & context lean. A lightweight meta-gateway and dynamic dispatcher for the MCP ecosystem."
license = "MIT"
repository = "https://github.com/caby-dev/caby"
readme = "README.md"
keywords = ["mcp", "model-context-protocol", "gateway", "proxy", "llm", "cli"]
categories = ["command-line-utilities", "development-tools", "web-programming"]

[[bin]]
name = "caby"
path = "src/main.rs"

[[bin]]
name = "mock-mcp"
path = "src/bin/mock-mcp.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-std",
    "io-util",
    "net",
    "sync",
    "time",
    "signal",
    "fs",
] }
clap = { version = "4", features = ["derive"] }
notify = "8"
dirs = "6"
anyhow = "1"
ureq = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3"